[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-audio-transcribe"
version = "0.1.0"
description = "Dockerized Python CLI for high-quality audio transcription with the OpenAI API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.109.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
transcribe = "transcribe_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
